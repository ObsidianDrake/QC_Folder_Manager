name: Validate QC Folder Manager
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt -r requirements-build.txt
      - run: make test
      - run: make check-config
      - run: make build
      - run: python tests/smoke_binary.py dist/qc-folder-manager
      # Ubuntu binaries are smoke-test artifacts, not RHEL release binaries.
