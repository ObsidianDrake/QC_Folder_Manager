# 複製為 config.yml；對外 URL、資料目錄與 OAuth 資訊於部署時設定。
# 所有 host、組織、repository、URL、路徑及 build number 均為虛構範例。
# 建置目標：RHEL 8.10 / Python 3.9.10；不使用 Docker。
schema_version: 1

server:
  listen: "127.0.0.1"  # 反向代理部署；直接對外服務時自行調整。
  # port: 9080  # 省略、null 或 0：由 OS 分配並保留可用 port；固定 port 則取消註解。
  public_url: "http://tools.example.com/qc_folder_mgt"  # 範例；改成使用者實際瀏覽的網址，可含子路徑。
  data_dir: "./data"  # 相對於設定檔；正式部署建議使用本機持久化絕對路徑。
  workers: 2
  session_hours: 8
  scan_interval_seconds: 300  # 每個專案掃描結束後等待 5 分鐘再掃描；60–86400 秒，修改後需重啟。

traefik_api:
  enable: false  # true：啟動註冊 route，正常結束／SIGTERM／Ctrl+C 時移除。
  base_url: "http://route-api.example.com:8000"  # Traefik-API，不是 Traefik dashboard API。
  token: "replace-with-traefik-api-token"
  route_name: "qc-folder-manager"
  upstream_host: "127.0.0.1"  # Traefik 與 API 都可連到的本服務主機；不含 scheme 或 port。
  timeout_seconds: 30  # 需涵蓋 API 接管舊 route 時的探測時間；1–300 秒。
  # Host / pathPrefix 從 server.public_url 取得；保留子路徑，不使用 StripPrefix。
  # 若用手動 Traefik 設定且 enable: false，請指定固定 server.port。

logging:
  directory: "./data/logs"  # 相對於設定檔；不得位於受管理的 run folder。
  max_bytes: 10485760       # 每檔 10 MiB；依大小自動 rolling。
  backup_count: 5          # 目前檔 + 5 份備份，穩態約 60 MiB 上限。

gitea:
  base_url: "https://git.example.com/gitea"
  client_id: "replace-with-gitea-client-id"
  client_secret: "replace-with-gitea-client-secret"
  scopes: "read:user read:organization"
  # Gitea 網站管理員以登入後的 is_admin 判定，不設定帳號白名單。

drone:
  base_url: "https://ci.example.com/drone"
  token: "replace-with-drone-token"  # 管理員在伺服器設定；Vendor 不需提供。

hosts:
  local:
    environment: "zone-a"
    transport: "local"  # 直接操作服務主機可存取的 filesystem。
  remote-worker:
    environment: "zone-b"
    transport: "ssh"
    hostname: "qc-worker.example.com"
    dust:
      executable: "dust"  # 在此遠端主機執行；建議填 dust 的絕對路徑。local host 也支援此設定。
      threads: 4  # 1–64，限制並行 metadata 查詢。
      timeout_seconds: 1800  # SSH host 的實際上限為 ssh.timeout_seconds 減 5 秒。
    ssh:
      python: "python3"  # 遠端主機需 Python >= 3.9；可指定既有 Python 的絕對路徑。
      timeout_seconds: 1800
      # 沿用該帳號既有的 SSH config、port、key / agent 與 known_hosts。
      # 不切換 user、不要求填入 username 或 private key 路徑。
      # 未填 password 時沿用 SSH key / agent；填入後使用密碼登入。
      # password: "replace-with-linux-password"
      # strict 沿用既有主機信任設定；accept-new 自動保存首次見到的金鑰，拒絕變更的金鑰。
      host_key_checking: "strict"
      # accept-new 預設使用 <server.data_dir>/ssh_known_hosts，覆蓋系統的 /dev/null 設定。
      # known_hosts: "./data/ssh_known_hosts"

projects:
  - id: "example-qc-remote"
    organization: "ExampleVendor"
    repository: "Example_QC"
    host: "remote-worker"
    run_folder: "/srv/qc/example-project"
    prefix: "qc"
    allow_user_delete: true  # false: only admins may delete; running builds remain protected
    # 虛構案例：此根目錄下的 qc_1234 對應 Drone build #1234。

